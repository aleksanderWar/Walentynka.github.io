<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Czy będziesz moją Walentynką?</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    padding: 0;
    text-align: center;
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
    transition: 0.6s;
}

.container {
    margin-top: 60px;
    position: relative;
    z-index: 2;
}

h1 {
    font-family: 'Pacifico', cursive;
    font-size: 42px;
    color: #fff;
}

img {
    width: 220px;
    margin: 20px 0;
}

button {
    padding: 15px 35px;
    font-size: 22px;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    margin: 15px;
    transition: 0.3s;
}

#yesBtn {
    background-color: #ff4d6d;
    color: white;
}

#noBtn {
    background-color: #444;
    color: white;
}

#secret {
    margin-top: 40px;
    font-size: 14px;
    color: white;
    opacity: 0.9;
}

.bigLove {
    font-size: 65px;
    color: white;
    font-weight: bold;
    animation: pulse 1s infinite alternate;
}

@keyframes pulse {
    from { transform: scale(1); }
    to { transform: scale(1.1); }
}

/* Serduszka */
.heart {
    position: fixed;
    top: -10px;
    font-size: 20px;
    animation: fall linear forwards;
    z-index: 1;
}

@keyframes fall {
    to {
        transform: translateY(110vh);
    }
}
</style>
</head>

<body>

<!-- Muzyka -->
<audio id="music" loop>
    <source src="https://cdn.pixabay.com/audio/2022/10/25/audio_946f6b2f0c.mp3" type="audio/mpeg">
</audio>

<div class="container" id="mainContent">
    <h1>Czy będziesz moją Walentynką? ❤️</h1>

    <img src="https://cdn.pixabay.com/photo/2016/11/29/09/32/heart-1867244_960_720.png">

    <div>
        <button id="yesBtn">TAK 💖</button>
        <button id="noBtn">NIE MA OPCJI 😈</button>
    </div>

    <div id="secret">
        Pod opcją „NIE MA OPCJI” jest niespodzianka... musisz kliknąć 😉
    </div>
</div>

<script>
let clickCount = 0;
let musicStarted = false;

const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const body = document.body;
const mainContent = document.getElementById("mainContent");
const music = document.getElementById("music");

/* Uruchom muzykę przy pierwszym kliknięciu */
function startMusic() {
    if (!musicStarted) {
        music.play();
        musicStarted = true;
    }
}

yesBtn.addEventListener("click", function() {
    startMusic();
    body.style.background = "linear-gradient(135deg, #ff4d6d, #c9184a)";
    mainContent.innerHTML = "<div class='bigLove'>IIIIIIIIIIIIIAAAAAAAAAAAAA KOOOOOOCHAM CIĘ !!!!!! ❤️❤️❤️</div>";
});

noBtn.addEventListener("click", function() {
    startMusic();
    clickCount++;
    let scaleAmount = 1 + (clickCount * 0.3);
    yesBtn.style.transform = "scale(" + scaleAmount + ")";

    if(clickCount >= 5){
        yesBtn.style.position = "fixed";
        yesBtn.style.top = "0";
        yesBtn.style.left = "0";
        yesBtn.style.width = "100vw";
        yesBtn.style.height = "100vh";
        yesBtn.style.fontSize = "80px";
        yesBtn.style.borderRadius = "0";
        noBtn.style.display = "none";
    }
});

/* Spadające serduszka */
function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (Math.random() * 20 + 15) + "px";
    heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}

setInterval(createHeart, 300);
</script>

</body>
</html>
